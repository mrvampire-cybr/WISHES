<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maha Shivaratri Divine Wishes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.8/clipboard.min.js"></script>
</head>
<body>
    <div class="lamp-container">
        <div class="lamp top-left"></div>
        <div class="lamp top-right"></div>
        <div class="lamp bottom-left"></div>
        <div class="lamp bottom-right"></div>
    </div>

    <div class="language-selector">
        <select id="languageSelect" class="input-field">
            <option value="en">English</option>
            <option value="hi">हिंदी</option>
            <option value="te">తెలుగు</option>
            <option value="ta">தமிழ்</option>
            <option value="ml">മലയാളം</option>
        </select>
    </div>

    <div class="container">
        <div id="receivedWish" class="received-wish" style="display: none;"></div>

        <div class="wish-card">
            <h1 id="mainTitle" class="glow-text">🕉️ Maha Shivaratri Blessings 🕉️</h1>
            <div class="shiva-container">
                <img src="/api/placeholder/500/300" alt="Lord Shiva" class="shiva-image">
                <div class="om-symbol">ॐ</div>
            </div>

            <div class="audio-player">
                <div class="audio-controls">
                    <button id="playButton" class="button">
                        <span class="play-icon">▶</span>
                        <span>Play Chant</span>
                    </button>
                    <div class="volume-control">
                        <span class="volume-icon">🔊</span>
                        <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="0.5">
                    </div>
                </div>
                <div class="audio-visualizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
            
            <div class="input-section">
                <input type="text" id="userName" class="input-field" placeholder="Enter your name">
                <button id="generateButton" class="button gradient-button">Generate Wish</button>
            </div>
            
            <div id="wishDisplay" class="wish-display" style="display: none;">
                <h2 id="blessingsTitle">🙏 Blessed Wishes 🙏</h2>
                <p id="wishText" class="wish-text"></p>
                <div class="share-options">
                    <button onclick="shareWish('whatsapp')" class="share-button whatsapp">
                        Share on WhatsApp
                    </button>
                    <button onclick="shareWish('facebook')" class="share-button facebook">
                        Share on Facebook
                    </button>
                    <button onclick="shareWish('copy')" class="share-button copy">
                        Copy Link
                    </button>
                </div>
            </div>
        </div>

        <div class="wish-card chant-card">
            <h3 id="chantTitle">Om Namah Shivaya Chant Counter</h3>
            <div class="counter-container">
                <div id="chantCounter" class="counter">0</div>
                <div class="sparkles"></div>
            </div>
            <button id="chantButton" class="button gradient-button">Count Chant</button>
            <div id="chantHistory" class="chant-history"></div>
        </div>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
